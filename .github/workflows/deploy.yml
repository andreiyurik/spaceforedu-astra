name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PUBLIC_CONTACT_WHATSAPP: ${{ secrets.PUBLIC_CONTACT_WHATSAPP }}
          PUBLIC_CONTACT_EMAIL: ${{ secrets.PUBLIC_CONTACT_EMAIL }}
          PUBLIC_SITE_URL: https://spaceforedu.com
          # Analytics. Without this the site ships with no measurement at all:
          # GtmHead.astro renders nothing when PUBLIC_GTM_ID is empty.
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}
          # Social profiles feed Organization.sameAs and the blog share buttons.
          PUBLIC_SOCIAL_LINKEDIN: ${{ secrets.PUBLIC_SOCIAL_LINKEDIN }}
          PUBLIC_SOCIAL_TELEGRAM: ${{ secrets.PUBLIC_SOCIAL_TELEGRAM }}
          PUBLIC_SOCIAL_FACEBOOK: ${{ secrets.PUBLIC_SOCIAL_FACEBOOK }}
          PUBLIC_SOCIAL_YOUTUBE: ${{ secrets.PUBLIC_SOCIAL_YOUTUBE }}
          PUBLIC_SOCIAL_TWITTER: ${{ secrets.PUBLIC_SOCIAL_TWITTER }}
          PUBLIC_SOCIAL_GOOGLE_BUSINESS: ${{ secrets.PUBLIC_SOCIAL_GOOGLE_BUSINESS }}
          # Cobro. Sin estas, los botones de pago caen al enlace de respaldo y
          # el sitio se despliega en verde sin poder cobrar nada: exactamente
          # lo que le pasaba a PUBLIC_GTM_ID antes de arreglarlo.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_BUY_BUTTON_500: ${{ secrets.PUBLIC_STRIPE_BUY_BUTTON_500 }}
          PUBLIC_STRIPE_BUY_BUTTON_100: ${{ secrets.PUBLIC_STRIPE_BUY_BUTTON_100 }}
          PUBLIC_STRIPE_LINK_BACHILLERATO_500: ${{ secrets.PUBLIC_STRIPE_LINK_BACHILLERATO_500 }}
          PUBLIC_STRIPE_LINK_CONSULTA_100: ${{ secrets.PUBLIC_STRIPE_LINK_CONSULTA_100 }}
          # Agenda de citas. Vacia -> el bloque no se renderiza.
          PUBLIC_CALENDAR_BOOKING_URL: ${{ secrets.PUBLIC_CALENDAR_BOOKING_URL }}
          # Vista previa del panel de cliente. Sigue oculta hasta desplegar Rails.
          PUBLIC_FEATURE_DASHBOARD: ${{ secrets.PUBLIC_FEATURE_DASHBOARD }}
        run: npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -avz --delete --exclude='wp' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/u724402354/domains/spaceforedu.com/public_html/
